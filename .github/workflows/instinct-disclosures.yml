name: instinct-disclosures
on:
  schedule:
    - cron: "*/30 10-23,0-3 * * *"   # 15:30-09:00 IST window runs
  workflow_dispatch:
permissions:
  contents: write
concurrency: instinct-disclosures
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python instinct/disclosures/collect.py
      - run: |
          git config user.name "disclosure-logger"
          git config user.email "actions@users.noreply.github.com"
          git add instinct/disclosures/data
          git diff --cached --quiet || (git commit -m "disclosures: log $(date -u +%FT%TZ)" && git pull --rebase && git push)
